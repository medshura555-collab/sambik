[project]
name = "laba-po-pitonu"
version = "0.1.0"
description = "proekt obrabotki dannix"
authors = [
    {name = "medshura555-collab",email = "med.shura555@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "polars (>=2.0.0,<3.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)"
]
